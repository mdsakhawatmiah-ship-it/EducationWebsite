===================================================== */

const bookEnd = [
    "সহায়ক গ্রন্থসমূহ",
    "পরিশিষ্ট",
    "বোর্ড পরীক্ষার প্রশ্নপত্র"
];


/* =====================================================
   ELEMENTS
===================================================== */

const classSelect = document.getElementById("classSelect");
const subjectArea = document.getElementById("subjectArea");
const subjectSelect = document.getElementById("subjectSelect");

const chapterArea = document.getElementById("chapterArea");
const chapterSelect = document.getElementById("chapterSelect");

const lessonArea = document.getElementById("lessonArea");
const lessonSelect = document.getElementById("lessonSelect");

const lessonContent = document.getElementById("lessonContent");


/* =====================================================
   CLASS
===================================================== */

classSelect.addEventListener("change", function(){

    subjectArea.classList.add("hidden");
    chapterArea.classList.add("hidden");
    lessonArea.classList.add("hidden");
    lessonContent.classList.add("hidden");

    if(this.value === "class11"){

        subjectArea.classList.remove("hidden");

    }

});


/* =====================================================
   SUBJECT
===================================================== */

subjectSelect.addEventListener("change", function(){

    chapterSelect.innerHTML =
        '<option value="">-- অধ্যায় নির্বাচন করুন --</option>';

    if(this.value === "islamic"){

        chapters.forEach(chapter => {

            const option = document.createElement("option");

            option.value = chapter.id;

            option.textContent =
                chapter.title +
                (chapter.free ? " — FREE" : " — ৳৫০");

            chapterSelect.appendChild(option);

        });

        chapterArea.classList.remove("hidden");
    }

});


/* =====================================================
   CHAPTER
===================================================== */

chapterSelect.addEventListener("change", function(){

    const chapterId = Number(this.value);

    lessonSelect.innerHTML =
        '<option value="">-- পাঠ নির্বাচন করুন --</option>';

    lessonArea.classList.add("hidden");
    lessonContent.classList.add("hidden");

    if(!chapterId) return;

    const chapter =
        chapters.find(c => c.id === chapterId);

    if(!chapter) return;


    /*
       প্রথম অধ্যায় FREE
       অন্য অধ্যায় PAID
    */

    if(!chapter.free){

        lessonArea.classList.add("hidden");

        lessonContent.classList.remove("hidden");

        lessonContent.innerHTML = `

            <div class="chapter-title">
                ${chapter.title}
            </div>

            <div class="page">
                ${chapter.pages}
            </div>

            <span class="paid">PAID • ৳৫০</span>

            <h2>এই অধ্যায়টি পড়তে Online Book কিনুন</h2>

            <p>
                এই অধ্যায়ের সম্পূর্ণ পাঠ ও বিস্তারিত পড়ার জন্য
                ShukhiMart Online Book কিনুন।
            </p>

            <a
                class="buy-btn"
                href="${SHUKHIMART_URL}"
                target="_blank">
                Online Book কিনুন — ৳৫০
            </a>

        `;

        return;
    }


    /*
       FREE CHAPTER
    */

    chapter.lessons.forEach((lesson,index)=>{

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            (index + 1) + ". " + lesson;

        lessonSelect.appendChild(option);

    });

    lessonArea.classList.remove("hidden");

});


/* =====================================================
   LESSON
===================================================== */

lessonSelect.addEventListener("change", function(){

    const chapterId =
        Number(chapterSelect.value);

    const lessonIndex =
        Number(this.value);

    if(!chapterId || isNaN(lessonIndex)){

        lessonContent.classList.add("hidden");

        return;
    }

    const chapter =
        chapters.find(c => c.id === chapterId);

    if(!chapter) return;

    const lesson =
        chapter.lessons[lessonIndex];


    /*
       এখানে পরবর্তীতে প্রতিটি পাঠের
       সম্পূর্ণ বিস্তারিত লেখা বসানো যাবে।
    */

    lessonContent.classList.remove("hidden");

    lessonContent.innerHTML = `

        <div class="chapter-title">
            ${chapter.title}
        </div>

        <div class="page">
            ${chapter.pages}
        </div>

        <span class="free">FREE</span>

        <div class="lesson-box">

            <h2>
                পাঠ ${lessonIndex + 1}:
                ${lesson}
            </h2>

            <div class="content">

                <h3>পাঠের বিস্তারিত</h3>

                <p>
                এখানে "${lesson}" পাঠের সম্পূর্ণ
                বিস্তারিত আলোচনা লিখবেন।
                </p>

                <p>
                আপনি চাইলে এই অংশে বইয়ের
                অধ্যায়ের বিষয়বস্তু, ব্যাখ্যা,
                সংজ্ঞা, উদাহরণ এবং পরীক্ষার
                গুরুত্বপূর্ণ তথ্য যোগ করতে পারবেন।
                </p>

            </div>


            <h3>সৃজনশীল প্রশ্ন ১</h3>

            <div class="question">

                <strong>প্রশ্ন:</strong>

                এখানে সৃজনশীল প্রশ্ন ১ লিখবেন।

            </div>

            <div class="answer">

                <strong>উত্তর:</strong>

                এখানে সৃজনশীল প্রশ্ন ১-এর
                সম্পূর্ণ উত্তর লিখবেন।

            </div>


            <h3>সৃজনশীল প্রশ্ন ২</h3>

            <div class="question">

                <strong>প্রশ্ন:</strong>

                এখানে সৃজনশীল প্রশ্ন ২ লিখবেন।

            </div>

            <div class="answer">

                <strong>উত্তর:</strong>

                এখানে সৃজনশীল প্রশ্ন ২-এর
                সম্পূর্ণ উত্তর লিখবেন।

            </div>

        </div>

    `;

});

</script>
