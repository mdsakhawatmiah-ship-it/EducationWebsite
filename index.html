   ELEMENTS
===================================================== */

const classSelect =
document.getElementById("classSelect");

const subjectArea =
document.getElementById("subjectArea");

const subjectSelect =
document.getElementById("subjectSelect");

const chapterArea =
document.getElementById("chapterArea");

const chapterSelect =
document.getElementById("chapterSelect");

const lessonArea =
document.getElementById("lessonArea");

const lessonSelect =
document.getElementById("lessonSelect");

const lessonContent =
document.getElementById("lessonContent");


let currentChapters = [];


/* =====================================================
   CLASS
===================================================== */

classSelect.addEventListener("change", function(){

    subjectArea.classList.add("hidden");
    chapterArea.classList.add("hidden");
    lessonArea.classList.add("hidden");
    lessonContent.classList.add("hidden");

    subjectSelect.value = "";

    chapterSelect.innerHTML =
    '<option value="">-- অধ্যায় নির্বাচন করুন --</option>';

    lessonSelect.innerHTML =
    '<option value="">-- পাঠ নির্বাচন করুন --</option>';

    if(this.value === "class11"){

        subjectArea.classList.remove("hidden");

        subjectSelect.innerHTML = `
            <option value="">
                -- বিষয় নির্বাচন করুন --
            </option>

            <option value="islamic1">
                ইসলাম শিক্ষা ১ম পত্র
            </option>
        `;
    }

    if(this.value === "class12"){

        subjectArea.classList.remove("hidden");

        subjectSelect.innerHTML = `
            <option value="">
                -- বিষয় নির্বাচন করুন --
            </option>

            <option value="islamic2">
                ইসলাম শিক্ষা ২য় পত্র
            </option>
        `;
    }

});


/* =====================================================
   SUBJECT
===================================================== */

subjectSelect.addEventListener("change", function(){

    chapterSelect.innerHTML =
    '<option value="">-- অধ্যায় নির্বাচন করুন --</option>';

    lessonSelect.innerHTML =
    '<option value="">-- পাঠ নির্বাচন করুন --</option>';

    chapterArea.classList.add("hidden");
    lessonArea.classList.add("hidden");
    lessonContent.classList.add("hidden");

    currentChapters = [];

    if(this.value === "islamic1"){
        currentChapters = chapters11;
    }

    if(this.value === "islamic2"){
        currentChapters = chapters12;
    }

    currentChapters.forEach(chapter => {

        const option =
        document.createElement("option");

        option.value = chapter.id;

        option.textContent =
        chapter.title +
        (chapter.free ? " — FREE" : " — ৳১৫");

        chapterSelect.appendChild(option);

    });

    if(currentChapters.length){
        chapterArea.classList.remove("hidden");
    }

});


/* =====================================================
   CHAPTER
===================================================== */

chapterSelect.addEventListener("change", function(){

    const chapterId =
    Number(this.value);

    lessonSelect.innerHTML =
    '<option value="">-- পাঠ নির্বাচন করুন --</option>';

    lessonArea.classList.add("hidden");
    lessonContent.classList.add("hidden");

    if(!chapterId) return;

    const chapter =
    currentChapters.find(c => c.id === chapterId);

    if(!chapter) return;


    /* PAID */

    if(!chapter.free){

        lessonContent.classList.remove("hidden");

        lessonContent.innerHTML = `

            <div class="chapter-title">
                ${chapter.title}
            </div>

            <div class="page">
                ${chapter.pages}
            </div>

            <span class="paid">
                PAID • ৳১৫
            </span>

            <h2>
                এই অধ্যায়টি পড়তে Online Book কিনুন
            </h2>

            <p>
                এই অধ্যায়ের সম্পূর্ণ পাঠ ও বিস্তারিত
                পড়ার জন্য ShukhiMart Online Book কিনুন।
            </p>

            <a
                class="buy-btn"
                href="${SHUKHIMART_URL}"
                target="_blank"
                rel="noopener">
                Online Book কিনুন — ৳১৫
            </a>

        `;

        return;
    }


    /* FREE */

    chapter.lessons.forEach((lesson,index)=>{

        const option =
        document.createElement("option");

        option.value = index;

        option.textContent =
        (index + 1) + ". " + lesson;

        lessonSelect.appendChild(option);

    });

    lessonArea.classList.remove("hidden");

});
