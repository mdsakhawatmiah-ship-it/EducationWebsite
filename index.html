                  "important": "<ul><li>গুরুত্বপূর্ণ তথ্য এখানে যোগ করা যাবে।</li><li>পরীক্ষার জন্য প্রয়োজনীয় তথ্য এখানে থাকবে।</li></ul>",
                  "questions": [
                    {
                      "question": "নৈতিক, অসাম্প্রদায়িক ও মানবিক মূল্যবোধ গঠনে তাসাউফের ভূমিকা সম্পর্কে আলোচনা কর।",
                      "answer": "এই প্রশ্নের বিস্তারিত উত্তর Admin Panel থেকে যোগ করা যাবে।"
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};

const classSelect=document.getElementById("classSelect");
const subjectSelect=document.getElementById("subjectSelect");
const chapterSelect=document.getElementById("chapterSelect");
const lessonSelect=document.getElementById("lessonSelect");
const subjectArea=document.getElementById("subjectArea");
const chapterArea=document.getElementById("chapterArea");
const lessonArea=document.getElementById("lessonArea");
const lessonContent=document.getElementById("lessonContent");

function resetSelect(select, text){
  select.innerHTML=`<option value="">${text}</option>`;
}

studyData.classes.forEach(cls=>{
  const o=document.createElement("option"); o.value=cls.id; o.textContent=cls.name; classSelect.appendChild(o);
});

classSelect.addEventListener("change",()=>{
  resetSelect(subjectSelect,"-- বিষয় নির্বাচন করুন --");
  resetSelect(chapterSelect,"-- অধ্যায় নির্বাচন করুন --");
  resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --");
  subjectArea.classList.add("hidden"); chapterArea.classList.add("hidden"); lessonArea.classList.add("hidden"); lessonContent.classList.add("hidden");
  const cls=studyData.classes.find(x=>x.id===classSelect.value);
  if(!cls)return;
  cls.subjects.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.name;subjectSelect.appendChild(o);});
  subjectArea.classList.remove("hidden");
});

subjectSelect.addEventListener("change",()=>{
  resetSelect(chapterSelect,"-- অধ্যায় নির্বাচন করুন --"); resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --");
  chapterArea.classList.add("hidden"); lessonArea.classList.add("hidden"); lessonContent.classList.add("hidden");
  const cls=studyData.classes.find(x=>x.id===classSelect.value); if(!cls)return;
  const sub=cls.subjects.find(x=>x.id===subjectSelect.value); if(!sub)return;
  sub.chapters.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.title;chapterSelect.appendChild(o);});
  chapterArea.classList.remove("hidden");
});

chapterSelect.addEventListener("change",()=>{
  resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --"); lessonArea.classList.add("hidden"); lessonContent.classList.add("hidden");
  const cls=studyData.classes.find(x=>x.id===classSelect.value); if(!cls)return;
  const sub=cls.subjects.find(x=>x.id===subjectSelect.value); if(!sub)return;
  const ch=sub.chapters.find(x=>x.id===chapterSelect.value); if(!ch)return;
  ch.lessons.forEach((l,i)=>{const o=document.createElement("option");o.value=l.id;o.textContent=`পাঠ ${i+1}: ${l.title} ${l.isFree?"(FREE)":"(৳10)"}`;lessonSelect.appendChild(o);});
  lessonArea.classList.remove("hidden");
});

lessonSelect.addEventListener("change",()=>{
  const cls=studyData.classes.find(x=>x.id===classSelect.value); if(!cls)return;
  const sub=cls.subjects.find(x=>x.id===subjectSelect.value); if(!sub)return;
  const ch=sub.chapters.find(x=>x.id===chapterSelect.value); if(!ch)return;
  const l=ch.lessons.find(x=>x.id===lessonSelect.value); if(!l){lessonContent.classList.add("hidden");return;}

  const purchaseHTML=l.isFree?"":`
    <div class="buy-box">
      <h3>🔒 এই পাঠটি Paid</h3>
      <p>এই পাঠ পড়তে Online Book কিনুন।</p>
      <p>মূল্য: ৳${l.price}</p>
      <a class="buy-button" href="https://shukhimart.com.bd/product/online-book-UDzKcg" target="_blank" rel="noopener">Online Book কিনুন</a>
    </div>`;

  const questions=(l.questions||[]).map((q,i)=>`
    <div class="question-box">
      <div class="question-title">সৃজনশীল প্রশ্ন ${i+1}</div>
      <div class="question"><strong>প্রশ্ন:</strong><br>${q.question}</div>
      <div class="answer"><strong>উত্তর:</strong><br>${q.answer}</div>
    </div>`).join("");

  lessonContent.innerHTML=`
    <div class="chapter-title">${ch.title}</div>
    <div class="page">${ch.pages||""}</div>
    <span class="badge ${l.isFree?"free":"paid"}">${l.isFree?"FREE":"PAID — ৳"+l.price}</span>
    ${purchaseHTML}
    <div class="lesson-box">
      <div class="lesson-title">পাঠ: ${l.title}</div>
      <div class="content-section"><h3>📖 মূল আলোচনা</h3>${l.introduction||""}</div>
      <div class="content-section"><h3>📚 সংজ্ঞা</h3>${l.definition||""}</div>
      <div class="content-section"><h3>⭐ গুরুত্বপূর্ণ তথ্য</h3>${l.important||""}</div>
      <div class="question-section"><h3>📝 সৃজনশীল প্রশ্ন ও উত্তর</h3>${questions||"<p>এই পাঠের প্রশ্ন এখনো যোগ করা হয়নি।</p>"}</div>
    </div>`;
  lessonContent.classList.remove("hidden");
});
</script>
</body>
</html>
