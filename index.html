];



/* ===========================
   HTML ELEMENT
=========================== */

const classSelect =
  document.getElementById("classSelect");

const subjectSelect =
  document.getElementById("subjectSelect");

const chapterSelect =
  document.getElementById("chapterSelect");

const subjectArea =
  document.getElementById("subjectArea");

const chapterArea =
  document.getElementById("chapterArea");

const lessonListArea =
  document.getElementById("lessonListArea");

const chapterTitle =
  document.getElementById("chapterTitle");

const lessonList =
  document.getElementById("lessonList");

const lessonContent =
  document.getElementById("lessonContent");



/* ===========================
   CLASS LOAD
=========================== */

studyData.forEach(item => {

  const option =
    document.createElement("option");

  option.value = item.id;
  option.textContent = item.name;

  classSelect.appendChild(option);

});



/* ===========================
   CLASS CHANGE
=========================== */

classSelect.addEventListener("change", function() {

  subjectSelect.innerHTML =
    `<option value="">-- বিষয় নির্বাচন করুন --</option>`;

  chapterSelect.innerHTML =
    `<option value="">-- অধ্যায় নির্বাচন করুন --</option>`;

  lessonList.innerHTML = "";

  lessonListArea.classList.add("hidden");
  lessonContent.classList.add("hidden");

  const selectedClass =
    studyData.find(item =>
      item.id === this.value
    );

  if (!selectedClass) {

    subjectArea.classList.add("hidden");
    chapterArea.classList.add("hidden");

    return;
  }

  selectedClass.subjects.forEach(subject => {

    const option =
      document.createElement("option");

    option.value = subject.id;
    option.textContent = subject.name;

    subjectSelect.appendChild(option);

  });

  subjectArea.classList.remove("hidden");

  chapterArea.classList.add("hidden");

});



/* ===========================
   SUBJECT CHANGE
=========================== */

subjectSelect.addEventListener("change", function() {

  chapterSelect.innerHTML =
    `<option value="">-- অধ্যায় নির্বাচন করুন --</option>`;

  lessonList.innerHTML = "";

  lessonListArea.classList.add("hidden");
  lessonContent.classList.add("hidden");

  const selectedClass =
    studyData.find(item =>
      item.id === classSelect.value
    );

  if (!selectedClass) return;

  const selectedSubject =
    selectedClass.subjects.find(item =>
      item.id === this.value
    );

  if (!selectedSubject) {

    chapterArea.classList.add("hidden");

    return;
  }

  selectedSubject.chapters.forEach(chapter => {

    const option =
      document.createElement("option");

    option.value = chapter.id;
    option.textContent = chapter.title;

    chapterSelect.appendChild(option);

  });

  chapterArea.classList.remove("hidden");

});



/* ===========================
   CHAPTER CHANGE
=========================== */

chapterSelect.addEventListener("change", function() {

  lessonList.innerHTML = "";

  lessonContent.classList.add("hidden");

  const selectedClass =
    studyData.find(item =>
      item.id === classSelect.value
    );

  if (!selectedClass) return;

  const selectedSubject =
    selectedClass.subjects.find(item =>
      item.id === subjectSelect.value
    );

  if (!selectedSubject) return;

  const selectedChapter =
    selectedSubject.chapters.find(item =>
      item.id === this.value
    );

  if (!selectedChapter) {

    lessonListArea.classList.add("hidden");

    return;
  }

  chapterTitle.textContent =
    selectedChapter.title;

  selectedChapter.lessons.forEach((lesson, index) => {

    const lessonItem =
      document.createElement("div");

    lessonItem.className = "lesson-item";

    const status = lesson.isFree

      ? `<span class="free">ফ্রি</span>`

      : `<span class="paid">৳${lesson.price}</span>`;

    lessonItem.innerHTML = `
      <div class="lesson-name">
        ${lesson.title}
        ${status}
      </div>
    `;

    lessonItem.addEventListener("click", function() {

      showLesson(
        lesson,
        selectedChapter.title
      );

    });

    lessonList.appendChild(lessonItem);

  });

  lessonListArea.classList.remove("hidden");

});



/* ===========================
   SHOW LESSON
=========================== */

function showLesson(lesson, chapterName) {

  lessonContent.classList.remove("hidden");

  if (!lesson.isFree) {

    lessonContent.innerHTML = `

      <div class="purchase-box">

        <h3>
          🔒 এই পাঠটি পেইড
        </h3>

        <p>
          এই পাঠের সম্পূর্ণ বিবরণ দেখতে
          আপনাকে ৳${lesson.price}
          প্রদান করতে হবে।
        </p>

        <a
          class="buy-button"
          href="https://shukhimart.com.bd/product/online-book-UDzKcg"
          target="_blank"
        >
          পাঠটি কিনুন — ৳${lesson.price}
        </a>

      </div>

      <h2>${lesson.title}</h2>

      <p>
        ${chapterName}
      </p>

    `;

    lessonContent.scrollIntoView({
      behavior: "smooth"
    });

    return;
  }


  /* FREE LESSON */

  let questionsHTML = "";

  lesson.questions.forEach((item, index) => {

    questionsHTML += `

      <div class="question">

        <strong>
          প্রশ্ন ${index + 1}:
          ${item.question}
        </strong>

        <div class="answer">

          <strong>উত্তর:</strong>

          ${item.answer}

        </div>

      </div>

    `;

  });


  lessonContent.innerHTML = `

    <h2>
      ${lesson.title}
      <span class="free">ফ্রি</span>
    </h2>

    <p>
      <strong>${chapterName}</strong>
    </p>


    <h3>
      📖 পাঠের বিস্তারিত
    </h3>

    ${lesson.introduction}


    <h3>
      📚 সংজ্ঞা
    </h3>

    ${lesson.definition}


    <h3>
      ⭐ গুরুত্বপূর্ণ তথ্য
    </h3>

    ${lesson.important}


    <h3>
      ❓ প্রশ্ন ও উত্তর
    </h3>

    ${questionsHTML}

  `;


  lessonContent.scrollIntoView({
    behavior: "smooth"
  });

}

</script>

</body>
</html>
